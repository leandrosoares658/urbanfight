backend:
  name: github
  repo: leandrosoares658/urbanfight   # usuário/repositório
  branch: main

# Permite rodar o painel localmente com `npx decap-server`
local_backend: true

locale: pt
media_folder: public/img/eventos
public_folder: /img/eventos

collections:
  - name: eventos
    label: Eventos
    label_singular: Evento
    folder: src/content/eventos
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} — {{year}}/{{month}}/{{day}}'
    sortable_fields: [data, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Data do evento, name: data, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false }
      - { label: Imagem, name: imagem, widget: image, required: false }
      - { label: Resumo, name: resumo, widget: text, hint: 'Uma ou duas linhas — aparece na listagem e na Home.' }
      - { label: Destacar na Home, name: destaque, widget: boolean, default: true }
      - { label: Conteúdo, name: body, widget: markdown }

  - name: horarios
    label: Horários das aulas
    files:
      - name: aulas
        label: Grade de horários
        file: src/content/horarios/aulas.json
        fields:
          - label: Aulas
            name: aulas
            widget: horarios-aulas
            hint: 'Importe a planilha com todas as aulas ou edite linha a linha. Colunas: Modalidade, Dia, Horário, Turma, Espaço.'
  - name: config
    label: Configurações
    files:
      - name: planos
        label: Planos e preços
        file: src/content/config/planos.json
        fields:
          - label: Planos
            name: planos
            widget: list
            label_singular: Plano
            summary: '{{fields.nome}}'
            fields:
              - { label: Nome do plano, name: nome, widget: string, hint: 'Ex.: Mensal, Semestre, Anual' }
              - label: Linhas de preço
                name: itens
                widget: list
                label_singular: Linha
                field: { label: Texto, name: texto, widget: string, hint: 'Ex.: R$ 125,00/mês - 1 modalidade' }
